# Tutorial Enemy — first fight of the game.
#
# True Pattern: ^[a-z]+\d{2,3}$
#   "one or more lowercase letters, then 2 or 3 digits, nothing else."
#
# Authoring goals:
#   Phase 1 teaches the *coarse shape*: "letters then digits, anchored".
#     Several almost-right Wards survive Phase 1 — e.g. ^[a-z]+\d+$
#     (matches any digit count), ^\w+$ (allows uppercase + underscore),
#     ^[a-z]+\d{2}$ (fixed two digits). Phase-1 sample is intentionally
#     ambiguous between these.
#
#   Phase 2 teaches the *digit-count and character-class boundaries*:
#     decoys are specifically the strings the plausibly-wrong Wards from
#     Phase 1 would *fail* on:
#       - `cat1`        (1 digit) — kills ^[a-z]+\d+$ over-broadness
#       - `cat1234`     (4 digits) — kills ^[a-z]+\d+$ over-broadness
#       - `Cat12`       (uppercase) — kills ^\w+$ over-broadness
#       - `cat_12`      (underscore) — kills ^\w+$ over-broadness
#     and reals push on the {2,3} boundary itself (`zoo10`, `pig999`).

id: tutorial
name: The First Lexer
pattern: '^[a-z]+\d{2,3}$'

baseHp: 10
defeatBounty: 10
flawlessBonus: 5
# 70% of drawn Spells are Real, 30% Decoys. More counter-opportunities
# per second makes the fight feel combat-paced rather than wait-paced.
# Combined with the counterattack-only damage model, this shortens
# expected encounter duration — `baseHp` is tuned accordingly.
realRate: 0.7

phases:
  # Phase 1 — coarse shape. Several plausible Wards pass here.
  # Enlarged pools give the player more pattern-matching variety under
  # the 7:3 ratio; without enlargement the same handful of strings
  # would repeat too quickly to feel like an evolving corpus.
  - hpThreshold: 1.0
    attack: 1
    realPool:
      - cat12
      - dog99
      - fish123
      - bird25
      - owl42
      - fox100
      - hen22
      - bee10
      - ant789
      - ram66
      - wolf07
      - lion50
    decoyPool:
      - 12cat        # digits-first — wrong order
      - meow         # no digits
      - cat-12       # punctuation breaks the simple shape
      - zebra        # no digits — all letters
      - panda        # no digits — all letters
      - '4242'       # all digits — no letters
      - dog.42       # punctuation
      - bird 25      # whitespace
      - '99'         # all digits, no letters

  # Phase 2 — distinguishing edge cases. The decoys here are the strings
  # that survive the most common Phase-1-plausible Wards.
  - hpThreshold: 0.5
    attack: 2
    realPool:
      - zoo10        # exactly the 2-digit lower boundary
      - pig999       # exactly the 3-digit upper boundary
      - apple42
      - frog77
      - koala500
      - newt88
      - moth100
      - swan12
    decoyPool:
      - cat1         # 1 digit  — defeats ^[a-z]+\d+$
      - cat1234      # 4 digits — defeats ^[a-z]+\d+$
      - Cat12        # uppercase — defeats ^\w+$
      - cat_12       # underscore — defeats ^\w+$
      - pig1         # 1 digit — same family as cat1
      - owl9999      # 4 digits — same family as cat1234
      - Dog42        # uppercase variant
      - frog_88      # underscore variant
      - rat          # all letters, no digits — easy filter, padding
      - '100'        # all digits — easy filter, padding

# Seed Spells: 3 Reals + 3 Decoys drawn from Phase 1 only, so the prep
# screen suggests the shape without spoiling the Phase-2 edge cases.
seedSpells:
  - { text: cat12, kind: Real }
  - { text: dog99, kind: Real }
  - { text: fish123, kind: Real }
  - { text: 12cat, kind: Decoy }
  - { text: meow, kind: Decoy }
  - { text: cat-12, kind: Decoy }
